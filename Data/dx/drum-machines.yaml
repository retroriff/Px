BossDR55:
  name: Boss DR-55 Dr. Rhythm
  manufacturer: BOSS
  year: 1980
  type: Analog programmable drum machine
  notes: >-
    BOSS's first Dr. Rhythm model uses four analog voices: bass drum, snare drum, rim shot and hi-hat.
    Its compact step-writing system programs each voice with dedicated note and rest buttons, while the
    hi-hat is selected globally as eighth notes, sixteenth notes or off.

    Robin Guthrie from Cocteau Twins used the Dr. Rhythm and the Sound Master before using the TR-808 in "Garlands".

DRM16:
  name: Electro-Harmonix DRM-16
  manufacturer: Electro-Harmonix
  year: 1978
  type: Analog preset rhythm machine
  notes: >-
    The DRM-16 Digital Rhythm Matrix generates analog percussion and offers 16 preset rhythms selected through a four-by-four
    matrix of styles and variations. Its sounds include bass drum, snare, hi-hats, cymbal, handclap,
    woodblock and a switchable Space Drum. A dedicated bass drum output allows separate processing.

    Cabaret Voltaire placed the DRM-16 high in the mix to drive the rhythm for their 1980 single 
    **"Seconds Too Late"** and its B-side, **"Control Addict,"** combining its "chilly electro-clop" 
    with vocoders and heavily processed vocals.

    When Moby auctioned off his massive collection of over 200 drum machines in 2018,
    he kept only five units—**four of which were Electro-Harmonix drum machines**—praising them
    for their distinctive "disco swing" and calling them the first things he would grab 
    if his apartment caught fire.

EmuDrumulator:
  name: E-mu Drumulator
  manufacturer: E-mu Systems
  year: 1983
  type: Digital sample playback drum machine
  notes: >-
    Designed by Dave Rossum and Scott Wedge at E-MU Systems and released in early 1983, 
    the Drumulator was a major breakthrough because it offered real digitally sampled 
    drum sounds for under $1,000.

    Depeche Mode used it extensively on their 1983 album "Construction Time Again" 
    (enjoying its separate outputs to process individual drum hits), as well as Howard Jones 
    and Tears for Fears.

    Digidrums Sound Chips (for the Drumulator): Created by Evan Brooks and Peter Gotcher 
    (who later founded Digidesign and developed Pro Tools). They designed custom replacement 
    EPROM chip sets that allowed users to swap out the stock Drumulator sounds.

    Their most iconic release was the **"Rock Drums 1"** chip set, was used to create the 
    massive driving beats on Tears for Fears' "Shout", Cocteau Twins' album "Treasure", 
    and early Beastie Boys tracks like "Beastie Groove".

KorgKR55:
  name: Korg KR-55
  manufacturer: Korg
  year: 1979
  type: Analog preset rhythm machine
  notes: >-
    Built in Japan by **Korg** as the Korg Rhythm 55, it opened the KR line that later produced the smaller KR-33
    and the programmable KPR-77, and it was reissued as the KR-55B with a revised output section.

    Its standout feature—considered quite revolutionary for the time—was a set of six mixer controls that 
    allowed users to adjust the individual volume levels of its 12 drum sounds.

    Mute Records founder Daniel Miller utilized the KR-55 alongside an ARP 2600 synthesizer, using the KR-55 
    for conventional hi-hat and snare sounds while crafting the kick drum on the ARP.

    Miller brought the KR-55 into the studio for Depeche Mode's debut album, Speak & Spell, using the machine's "Disco 2" 
    preset pattern as the foundation for the track "Photographic".

KorgMinipops:
  name: Korg Minipops
  manufacturer: Keio Electronic Laboratories
  year: 1966
  type: Analog preset rhythm machine
  notes: >-
    Built in Japan by Keio Electronic Laboratories, the company that later renamed itself Korg, the Mini Pops
    line succeeded the electromechanical Donca-Matic units and became Keio's first all solid-state rhythm
    machines.

    The flagship Mini Pops 7 carried fifteen voices — bass, two snares, rimshot, hi-hat, two cymbals, cowbell,
    conga, large and small bongo, claves, quijada, guiro and tambourine — all generated with inductors, which
    makes the circuit notoriously hard to clone. Individual faders let each voice be balanced in the mix, a rare
    luxury for the period.

    Donna Summer / Pete Bellotte / Giorgio Moroder: Used a Korg Minipops (cha-cha preset) to lay down the steady 
    foundation for "Love to Love You Baby".

    Métal Urbain used a Korg Minipops 120P, which Eric Débris modified with custom soldered switches and wiring.

LinnDrum:
  name: LinnDrum
  manufacturer: Linn Electronics
  year: 1982
  type: Digital sample playback drum machine
  notes: >-
    Released in late 1982 as the more affordable ($2,995) successor to the 
    LM-1, featuring real cymbals and trigger inputs.

    The Psychedelic Furs: Keith Forsey brought Idol's LinnDrum-driven sound to their album "Mirror Moves".

LinnLM1:
  name: Linn LM-1 Drum Computer
  manufacturer: Linn Electronics
  year: 1980
  type: Digital sample playback drum machine
  notes: >-
    Designed by Roger Linn, the LM-1 was the first programmable drum machine to use digital samples of acoustic
    drums. Its 8-bit samples gave it a markedly more realistic sound than the analog rhythm machines available at
    the time.

    The acoustic drum samples in the Linn LM-1 were provided by session drummer Art Wood.

    The Linn LM-1 revolutionized music production by pairing real 8-bit sampled acoustic drum sounds with real-time tap programming, quantized auto-
    correction, swing feel, individual pitch tuning, and separate audio outputs.

    When Roger Linn demonstrated his initial cardboard-box prototype, several high-profile musicians immediately put down $2,500 deposits to secure
    early production models, including **Stevie Wonder**, **Herbie Hancock**, **Giorgio Moroder**, and **Frank Zappa**.

    Prince was the LM-1's most dedicated user, who relied on it across his classic 1980s catalog. He debuted it on "Private Joy" ("Controversy"), 
    built *1999* and *Purple Rain* around it, and famously detuned the sidestick to create the knocking beat for "When Doves Cry".

    **Herbie Hancock**: Received the second production unit manufactured, debuting it on the track "Textures" from *Mr. Hands*.

    **John Carpenter**: Used the LM-1 to compose the futuristic score for the 1981 film *Escape From New York*.

OberheimDMX:
  name: Oberheim DMX
  manufacturer: Oberheim Electronics
  year: 1981
  type: Digital sample playback drum machine
  notes: >-
    Introduced in late 1981, the DMX has eight independent drum voices with up to three sounds each,
    for 24 sounds in total. Each voice has its own tunable, replaceable sound card, level control,
    and direct audio output.

    Producers Michael Beinhorn and Bill Laswell used the DMX as their primary drum machine to 
    program Herbie Hancock's groundbreaking 1983 crossover hit "Rockit" and the album  "Future Shock".

    Reggie Griffin programmed "Willie" to build the foundation for Grandmaster Flash and the 
    Furious Five's "The Message" and "Scorpio".

    Linden Hudson programmed the DMX alongside a LinnDrum to establish a driving 124 BPM pulse for 
    ZZ Top's 1983 multi-platinum album "Eliminator", shaping hits like "Gimme All Your Lovin'", 
    "Legs", and "Thug".

Rhythm10:
  name: Farfisa Rhythm 10
  manufacturer: Farfisa
  year: 1969
  type: Analog preset rhythm machine
  notes: >-
    Built in Italy by **Farfisa** (Fabbriche Riunite di Fisarmoniche), the organ maker behind the Compact combo
    organs, the Rhythm 10 is a battery-powered analog box with ten preset patterns.

    Five buttons — Drum, Bongo, Claves, Snare D. and Cymbal — trigger the voices by hand so the player can fill
    over the sequencer, and a hard-wired footswitch halts the pattern and restarts it from the downbeat. Pushing
    the volume control past halfway drives the output into audible saturation, most obvious on the kick-like
    "Drum" voice.

    Michael Rother (Neu!) processed a Farfisa Rhythm 10 through guitar pedals and filters.

    Combined Jaki Liebezeit's live drumming with a Farfisa Rhythm 10 on "Peking O" and "Spoon".

    Kraftwerk used a Farfisa Rhythm 10 on Kraftwerk 2 ("Klingklang") and Ralf und Florian. 

    Wolfgang Flür wired the Farfisa's internal contact points to custom DIY metal drum plates to build their iconic electronic drum kit.

    Cluster used it on Zuckerzeit and Harmonia recordings.

    Cabaret Voltaire: Used a battery-powered Farfisa Rhythm 10.

RhythmAce:
  name: Ace Tone Rhythm Ace
  manufacturer: Ace Tone
  year: 1967
  type: Analog preset rhythm machine
  notes: >-
    Developed in Japan by **Ikutaro Kakehashi**, and rebranded in the UK as the Bentley Rhythm Ace, it was
    one of the first transistorized, fully automatic drum machines to achieve widespread
    commercial success and shape popular music.

    Users discovered they could press multiple buttons simultaneously to combine patterns into new polyrhythms,
    as well as use "cancel" buttons to mute specific instruments like the bass drum or cymbals.

    J. J. Cale used the Rhythm Ace on his 1971 album *Naturally* ("Call Me the Breeze", "Crazy Mama") simply because he lacked the funds to hire a live drummer.

    Rhythm Ace circuits integrated into Lowrey home organs powered Timmy Thomas's "Why Can't We Live Together" (1972).

    Chris Carter of Throbbing Gristle processed a secondhand Bentley Rhythm Ace through distortion, phasers, and wah-wah pedals to create heavy industrial tape loops.

    Brian Eno also featured it on his solo album Taking Tiger Mountain (By Strategy).

RhythmPrince:
  name: Seeburg Rhythm Prince
  manufacturer: Seeburg
  year: 1967
  type: Electro-mechanical preset rhythm machine
  notes: >-
    Built in the United States by **Seeburg**, the jukebox and coin-operated music firm, in collaboration with the
    home organ maker Gulbransen. It descends from the Kinsman Rhythm Prince and sits alongside the Select-A-Rhythm
    in the lineage that Seeburg's 1964 automatic rhythm patent opened up, predating the transistorized preset
    machines that followed it.

    Controls are limited to volume, tempo and the pattern buttons — two foxtrots, rhumba, samba, cha cha, 6/8 and
    2/4 marches and a waltz — and holding two presets down at once runs them together as a hybrid rhythm.

    Suicide (Martin Rev & Alan Vega): Used an analog Seeburg Rhythm Prince (cranking its tempo for tracks like 
    "Rocket USA" and "Frankie Teardrop"), later purchasing a used Univox SR-95.

RolandCompurhythm78:
  name: Roland CompuRhythm CR-78
  manufacturer: Roland
  year: 1978
  type: Analog programmable rhythm machine
  notes: >-
    Roland's first programmable rhythm machine combined 34 preset rhythms with four memory locations for user-created
    patterns. Its onboard microprocessor made those custom patterns storable, while the sound generation remained analog.

    The front panel provides rhythm selection, tempo, balance, fade-in and fade-out controls, plus automatic and manual
    fills. Multiple preset buttons can be engaged together to create composite rhythms.

    Ultravox used the CR-78 across their breakthrough 1980 album Vienna.

    Blondie used the Roland CR-78 to turn a struggling arrangement into the global disco-pop smash "Heart of Glass" (1978).

    Visage used the Roland CR-78 ("Disco 2" preset) for their New Romantic anthem "Fade to Grey" (1980).

    Tuxedomoonu used the PAiA Drum Set (programmed with custom shorthand notes between live songs) and the Roland CR-78 on Half Mute (1980).

    Other CR-78 Users: Roxy Music ("Dance Away"), Gary Numan (Telekon, Dance), Throbbing Gristle / Chris & Cosey (20 Jazz Funk Greats, Heartbeat) 
    and experimental composer Asmus Tietchens.

RolandSystem100:
  name: Roland System-100
  manufacturer: Roland
  year: 1975
  type: Semi-modular analog synthesizer
  notes: >-
    The system combined two monophonic synthesizers (a main keyboard unit and a secondary "brain" unit) housing oscillators, 
    filters, envelope generators, attenuators, built-in speakers, a four-channel mixer, and a 12-step sequencer.

    It is not a rhythm machine. Every sound here is percussion patched by hand rather than selected from a kit:
    noise through the filter for snares and hats, a fast pitch envelope on the oscillator for kicks and toms.

    Rather than being a standalone drum machine, the Roland System 100 was a semi-modular synthesizer costing nearly $2,000, 
    purchased by Martyn Ware and Ian Craig Marsh for their work in The Future and The Human League

RolandTR505:
  name: Roland TR-505
  manufacturer: Roland
  year: 1986
  type: Digital sample playback drum machine
  notes: >-
    The TR-505 Rhythm Composer plays 16 PCM drum and percussion sounds, including toms, congas, cowbells,
    timbale, and cymbals. Its 16-step sequencer offers 48 preset patterns and 48 user-programmable
    patterns, which can be arranged across six tracks.

    MIDI input and output connect it to other instruments, and it can run on six AA batteries.

RolandTR606:
  name: Roland TR-606
  manufacturer: Roland
  year: 1981
  type: Analog programmable drum machine
  notes: >-
    Released as a companion to the TB-303 Bass Line, the compact TR-606 Drumatix generates seven analog
    drum sounds: bass drum, snare, low and high toms, cymbal, and open and closed hi-hats.

    Its 16-step sequencer stores patterns in battery-backed memory and provides an accent control.
    The machine can run on batteries and synchronize with other equipment.

RolandTR707:
  name: Roland TR-707
  manufacturer: Roland
  year: 1985
  type: Digital sample playback
  notes: Crisp 12-bit kit, a house and Chicago acid regular

RolandTR727:
  manufacturer: Roland
  name: Roland TR-727
  notes: 15 PCM percussion sounds focused on Latin instruments such as congas, bongos, agogos, and maracas.
  type: Digital sample playback
  year: 1985

RolandTR808:
  name: Roland TR-808
  manufacturer: Roland
  year: 1980
  type: Analog
  notes: Booming tunable kick, cornerstone of electro and hip-hop

RolandTR909:
  name: Roland TR-909
  manufacturer: Roland
  year: 1983
  type: Analog / sample hybrid
  notes: House and techno staple

SoundmastersR88:
  name: Sound Master Memory Rhythm SR-88
  manufacturer: Sound Master
  year: 1981
  type: Analog programmable drum machine
  notes: >-
    The Memory Rhythm SR-88 is a compact four-voice analog machine with bass drum, snare drum, closed
    hi-hat and cymbal sounds. Patterns are written one step at a time by selecting a voice and using
    start and stop buttons to place hits and rests.

    When the DR-55's eight-pattern memory limit proved too small for full live sets, Robin Guthrie from Cocteau Twins bought two Sound Master SR-88 units

SimmonsSDS5:
  name: Simmons SDS5 Drum Synthesizer
  manufacturer: Simmons
  year: 1981
  type: Analog electronic drum kit
  notes: >-
    The SDS5, also known as the SDS-V, was Simmons's first commercially released electronic drum kit.
    The **Simmons SDS 5** was a fully modular electronic drum kit featuring iconic hexagonal hard-plastic pads that 
    triggered layered, customizable drum sounds across independent channels for the kick, snare, and toms, 
    with memory to store preset rhythm sounds.

    **Stephen Morris**—the drummer for **Joy Division** and **New Order**—was an early adopter of electronic drum pads and gear, driven by both 
    sound and visual aesthetic.

    Morris integrated the Synare 3 into Joy Division's live setup, using it to create the iconic "chi-chi" noise on **"She's Lost Control"**.

    As Joy Division transitioned into New Order, Morris moved from triggering drum pads to programming drum machines like the **Roland TR-808**, 
    which provided the pulse for dance-rock classics like **"Blue Monday"**.
