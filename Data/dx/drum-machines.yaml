KorgKR55:
  name: Korg KR-55
  manufacturer: Korg
  year: 1979
  type: Analog preset rhythm machine
  notes: >-
    Built in Japan by **Korg** as the Korg Rhythm 55, it opened the KR line that later produced the smaller KR-33
    and the programmable KPR-77, and it was reissued as the KR-55B with a revised output section.

    Its standout feature—considered quite revolutionary for the time—was a set of six mixer controls that 
    allowed users to adjust the individual volume levels of its 12 drum sounds.

    Mute Records founder Daniel Miller utilized the KR-55 alongside an ARP 2600 synthesizer, using the KR-55 
    for conventional hi-hat and snare sounds while crafting the kick drum on the ARP.

    Miller brought the KR-55 into the studio for Depeche Mode's debut album, Speak & Spell, using the machine's "Disco 2" 
    preset pattern as the foundation for the track "Photographic".

KorgMinipops:
  name: Korg Minipops
  manufacturer: Keio Electronic Laboratories
  year: 1966
  type: Analog preset rhythm machine
  notes: >-
    Built in Japan by Keio Electronic Laboratories, the company that later renamed itself Korg, the Mini Pops
    line succeeded the electromechanical Donca-Matic units and became Keio's first all solid-state rhythm
    machines.

    The flagship Mini Pops 7 carried fifteen voices — bass, two snares, rimshot, hi-hat, two cymbals, cowbell,
    conga, large and small bongo, claves, quijada, guiro and tambourine — all generated with inductors, which
    makes the circuit notoriously hard to clone. Individual faders let each voice be balanced in the mix, a rare
    luxury for the period.

    Donna Summer / Pete Bellotte / Giorgio Moroder: Used a Korg Minipops (cha-cha preset) to lay down the steady 
    foundation for "Love to Love You Baby".

    Métal Urbain used a Korg Minipops 120P, which Eric Débris modified with custom soldered switches and wiring.

Rhythm10:
  name: Farfisa Rhythm 10
  manufacturer: Farfisa
  year: 1969
  type: Analog preset rhythm machine
  notes: >-
    Built in Italy by **Farfisa** (Fabbriche Riunite di Fisarmoniche), the organ maker behind the Compact combo
    organs, the Rhythm 10 is a battery-powered analog box with ten preset patterns.

    Five buttons — Drum, Bongo, Claves, Snare D. and Cymbal — trigger the voices by hand so the player can fill
    over the sequencer, and a hard-wired footswitch halts the pattern and restarts it from the downbeat. Pushing
    the volume control past halfway drives the output into audible saturation, most obvious on the kick-like
    "Drum" voice.

    Michael Rother (Neu!) processed a Farfisa Rhythm 10 through guitar pedals and filters.

    Combined Jaki Liebezeit's live drumming with a Farfisa Rhythm 10 on "Peking O" and "Spoon".

    Kraftwerk used a Farfisa Rhythm 10 on Kraftwerk 2 ("Klingklang") and Ralf und Florian. 

    Wolfgang Flür wired the Farfisa's internal contact points to custom DIY metal drum plates to build their iconic electronic drum kit.

    Cluster used it on Zuckerzeit and Harmonia recordings.

    Cabaret Voltaire: Used a battery-powered Farfisa Rhythm 10.

RhythmAce:
  name: Ace Tone Rhythm Ace
  manufacturer: Ace Tone
  year: 1967
  type: Analog preset rhythm machine
  notes: >-
    Developed in Japan by **Ikutaro Kakehashi**, and rebranded in the UK as the Bentley Rhythm Ace, it was
    one of the first transistorized, fully automatic drum machines to achieve widespread
    commercial success and shape popular music.

    Users discovered they could press multiple buttons simultaneously to combine patterns into new polyrhythms,
    as well as use "cancel" buttons to mute specific instruments like the bass drum or cymbals.

    J. J. Cale used the Rhythm Ace on his 1971 album *Naturally* ("Call Me the Breeze", "Crazy Mama") simply because he lacked the funds to hire a live drummer.

    Rhythm Ace circuits integrated into Lowrey home organs powered Timmy Thomas's "Why Can't We Live Together" (1972).

    Chris Carter of Throbbing Gristle processed a secondhand Bentley Rhythm Ace through distortion, phasers, and wah-wah pedals to create heavy industrial tape loops.

    Brian Eno also featured it on his solo album Taking Tiger Mountain (By Strategy).

RhythmPrince:
  name: Seeburg Rhythm Prince
  manufacturer: Seeburg
  year: 1967
  type: Electro-mechanical preset rhythm machine
  notes: >-
    Built in the United States by **Seeburg**, the jukebox and coin-operated music firm, in collaboration with the
    home organ maker Gulbransen. It descends from the Kinsman Rhythm Prince and sits alongside the Select-A-Rhythm
    in the lineage that Seeburg's 1964 automatic rhythm patent opened up, predating the transistorized preset
    machines that followed it.

    Controls are limited to volume, tempo and the pattern buttons — two foxtrots, rhumba, samba, cha cha, 6/8 and
    2/4 marches and a waltz — and holding two presets down at once runs them together as a hybrid rhythm.

    Suicide (Martin Rev & Alan Vega): Used an analog Seeburg Rhythm Prince (cranking its tempo for tracks like 
    "Rocket USA" and "Frankie Teardrop"), later purchasing a used Univox SR-95.

RolandCompurhythm78:
  name: Roland CompuRhythm CR-78
  manufacturer: Roland
  year: 1978
  type: Analog programmable rhythm machine
  notes: >-
    Roland's first programmable rhythm machine combined 34 preset rhythms with four memory locations for user-created
    patterns. Its onboard microprocessor made those custom patterns storable, while the sound generation remained analog.

    The front panel provides rhythm selection, tempo, balance, fade-in and fade-out controls, plus automatic and manual
    fills. Multiple preset buttons can be engaged together to create composite rhythms.

    Ultravox used the CR-78 across their breakthrough 1980 album Vienna.

    Blondie used the Roland CR-78 to turn a struggling arrangement into the global disco-pop smash "Heart of Glass" (1978).

    Visage used the Roland CR-78 ("Disco 2" preset) for their New Romantic anthem "Fade to Grey" (1980).

    Tuxedomoonu used the PAiA Drum Set (programmed with custom shorthand notes between live songs) and the Roland CR-78 on Half Mute (1980).

    Other CR-78 Users: Roxy Music ("Dance Away"), Gary Numan (Telekon, Dance), Throbbing Gristle / Chris & Cosey (20 Jazz Funk Greats, Heartbeat) 
    and experimental composer Asmus Tietchens.

RolandSystem100:
  name: Roland System-100
  manufacturer: Roland
  year: 1975
  type: Semi-modular analog synthesizer
  notes: >-
    The system combined two monophonic synthesizers (a main keyboard unit and a secondary "brain" unit) housing oscillators, 
    filters, envelope generators, attenuators, built-in speakers, a four-channel mixer, and a 12-step sequencer.

    It is not a rhythm machine. Every sound here is percussion patched by hand rather than selected from a kit:
    noise through the filter for snares and hats, a fast pitch envelope on the oscillator for kicks and toms.

    Rather than being a standalone drum machine, the Roland System 100 was a semi-modular synthesizer costing nearly $2,000, 
    purchased by Martyn Ware and Ian Craig Marsh for their work in The Future and The Human League

RolandTR707:
  name: Roland TR-707
  manufacturer: Roland
  year: 1985
  type: Digital sample playback
  notes: Crisp 12-bit kit, a house and Chicago acid regular

RolandTR808:
  name: Roland TR-808
  manufacturer: Roland
  year: 1980
  type: Analog
  notes: Booming tunable kick, cornerstone of electro and hip-hop

RolandTR909:
  name: Roland TR-909
  manufacturer: Roland
  year: 1983
  type: Analog / sample hybrid
  notes: House and techno staple
